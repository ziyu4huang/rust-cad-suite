[package]
name = "rv-xls-sim"
description = "XLS VerilogSimulator-shaped process adapter over the shared rverilator core (argv + JSON protocol)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rv-xls-sim"
path = "src/main.rs"

[lib]
name = "rv_xls_sim"
path = "src/lib.rs"

[dependencies]
vl-syntax = { workspace = true }
vl-sim = { workspace = true }
vl-cli = { workspace = true }
rcs-diag = { workspace = true }
