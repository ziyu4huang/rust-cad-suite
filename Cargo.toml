[workspace]
resolver = "2"
members = [
    "crates/riv-cli",
    "crates/riv-difftest",
    "crates/riv-ir",
    "crates/riv-elab",
    "crates/riv-kernel",
    "crates/rcs-diag",
    "crates/vl-syntax",
    "crates/vl-values",
    "crates/vl-sim",
    "crates/vl-vcd",
    "crates/vl-spec",
    "crates/spec-i2c",
    "crates/vl-cli",
    "crates/vl-difftest",
    "crates/vl-wasm",
    "crates/vl-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["rust-cad-suite contributors"]

[workspace.dependencies]
rcs-diag = { path = "crates/rcs-diag" }
vl-syntax = { path = "crates/vl-syntax" }
vl-values = { path = "crates/vl-values" }
riv-ir = { path = "crates/riv-ir" }
riv-elab = { path = "crates/riv-elab" }
riv-kernel = { path = "crates/riv-kernel" }
vl-sim = { path = "crates/vl-sim" }
vl-vcd = { path = "crates/vl-vcd" }
vl-spec = { path = "crates/vl-spec" }
spec-i2c = { path = "crates/spec-i2c" }
vl-cli = { path = "crates/vl-cli" }
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.release]
debug = 1
