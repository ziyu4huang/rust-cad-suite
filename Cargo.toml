[workspace]
resolver = "2"
members = [
    "crates/rcs-diag",
    "crates/vl-syntax",
    "crates/vl-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["rust-cad-suite contributors"]

[workspace.dependencies]
rcs-diag = { path = "crates/rcs-diag" }
vl-syntax = { path = "crates/vl-syntax" }

[profile.release]
debug = 1
