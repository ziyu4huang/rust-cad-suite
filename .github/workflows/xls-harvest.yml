name: xls-harvest
# One-shot (workflow_dispatch) harvest: XLS DSLX -> IR -> Verilog codegen on
# the linux-x64 release binary; the artifact is self-contained so
# `python3 scripts/xls_adopt.py <artifact>` can verify (sha256 + adapter syntax
# check) and adopt it into corpus-external/xls without touching the rest of the
# snapshot. Apache-2.0: LICENSE travels with every snapshot.
on:
  workflow_dispatch: {}
jobs:
  harvest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Capture XLS release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --repo google/xls --json tagName --jq .tagName)
          test -n "$TAG"
          echo "XLS_TAG=$TAG" >> "$GITHUB_ENV"
          echo "harvesting google/xls $TAG"

      - name: Build rv-xls-sim (harvest syntax gate)
        run: cargo build -p rv-xls-sim

      - name: Fetch XLS release (linux-x64)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          URL=$(gh release view --repo google/xls --json assets --jq '.assets[] | select(.name | contains("linux-x64")) | .url')
          curl -L "$URL" -o xls.tar.gz
          mkdir xls-dist && tar xzf xls.tar.gz -C xls-dist
          find xls-dist -type f -name '*main*' | head

      - name: DSLX -> IR -> Verilog
        run: |
          mkdir -p out
          BIN=$(find xls-dist -name ir_converter_main | head -1)
          CGEN=$(find xls-dist -name codegen_main | head -1)
          $CGEN --helpfull > out/codegen-help.txt 2>&1 || true
          $BIN --top=add3 corpus-external/xls/dslx/add3.x > out/add3.ir
          $CGEN --top=add3 --delay_model=unit --pipeline_stages=1 out/add3.ir > out/add3.v 2> out/add3.codegen.log \
            || echo "WARN add3 codegen failed (acceptable for MVP)"
          $BIN --top=acc_pipe corpus-external/xls/dslx/acc_pipe.x > out/acc_pipe.ir 2> out/acc_pipe.ir.log \
            || echo "WARN acc_pipe IR failed (acceptable for MVP)"
          if [ -s out/acc_pipe.ir ]; then
            $CGEN --top=acc_pipe --generator pipeline --pipeline_stages=2 --delay_model=unit out/acc_pipe.ir > out/acc_pipe.v 2> out/acc_pipe.codegen.log \
              || $CGEN --top=acc_pipe --generator combinational out/acc_pipe.ir > out/acc_pipe.v \
              || echo "WARN acc_pipe codegen failed (acceptable for MVP)"
          fi

      - name: Normalize + stage the adoptable artifact
        run: |
          # rverilator targets Verilog-2005: always_ff -> always (semantics
          # identical for these single-clock flop blocks; raw copy kept under
          # artifact/raw/). XLS has no timescale concept; inject the harness
          # convention or TIMESCALEMOD warnings fire when the file precedes the
          # TB (verilator default-fatal; REGISTRY D16).
          mkdir -p artifact/generated artifact/dslx artifact/raw
          for v in out/*.v; do
            [ -s "$v" ] || continue
            base=$(basename "$v")
            cp "$v" "artifact/raw/$base"
            sed 's/always_ff @/always @/g' "$v" > "/tmp/$base"
            if grep -q '^`timescale' "/tmp/$base"; then
              cp "/tmp/$base" "artifact/generated/$base"
            else
              { printf '`timescale 1ns/1ps\n'; cat "/tmp/$base"; } > "artifact/generated/$base"
            fi
          done
          cp out/*.ir artifact/generated/
          cp corpus-external/xls/dslx/*.x artifact/dslx/

      - name: License + notice
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/google/xls/license --jq '.content' | base64 -d > artifact/XLS-LICENSE.txt
          {
            echo "https://github.com/google/xls (Apache-2.0)"
            echo "Snapshot: generated Verilog via XLS codegen_main ($XLS_TAG)"
          } > artifact/XLS-NOTICE.txt

      - name: Manifest + adapter syntax gate
        run: |
          python3 scripts/xls_harvest_manifest.py \
            --dir artifact --tag "$XLS_TAG" --adapter target/debug/rv-xls-sim
          cat artifact/manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: xls-generated
          path: artifact/

  # In-tree gate (ADR-0009 XLS arc, the "本機沒有 Bazel" residual): overlay
  # the rverilator_simulator subclass into a real google/xls checkout at the
  # harvested tag and BUILD it with Bazel — proves headers, deps, and the
  # layering_check/parse_headers features against the actual upstream tree,
  # which the macOS dev box cannot do (XLS release is linux-x64 only; this
  # gate exists ONLY here). v1 = the library target itself (self-contained
  # deps); registration into //xls/simulation:verilog_simulators and a live
  # simulator run land with the upstream PR.
  in-tree:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Capture XLS release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --repo google/xls --json tagName --jq .tagName)
          test -n "$TAG"
          echo "XLS_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Install bazelisk
        run: |
          curl -L -o /usr/local/bin/bazel             https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          chmod +x /usr/local/bin/bazel

      - name: Clone google/xls at the harvested tag
        run: |
          git clone --depth 1 --branch "$XLS_TAG"             https://github.com/google/xls.git "$HOME/xls"
          echo "XLS_TREE=$HOME/xls" >> "$GITHUB_ENV"

      - name: Overlay the subclass
        run: |
          DST="$XLS_TREE/xls/simulation/simulators"
          mkdir -p "$DST"
          cp crates/rv-xls-sim/cpp/xls/simulation/simulators/* "$DST/"
          ls -la "$DST"

      - name: Bazel build the subclass target
        working-directory: ${{ env.XLS_TREE }}
        run: |
          bazel build //xls/simulation/simulators:rverilator_simulator 2>&1 | tail -30
          test -f bazel-bin/xls/simulation/simulators/librverilator_simulator.a \
            || { echo "expected build output missing"; exit 1; }
